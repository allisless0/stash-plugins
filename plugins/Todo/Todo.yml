name: Todo
description: "A simple task list behind a Todo button in the top bar. Tasks link to the scene, performer, studio, tag, gallery or group page you wrote them on, and those pages show a chip with their tasks. Pin, group by who or what, undo a delete. Saved in Stash, so the list is the same on every device."
version: 1.3.0
url: https://github.com/allisless0/stash-plugins

ui:
  javascript:
    - Todo.js
