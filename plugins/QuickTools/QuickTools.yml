name: QuickTools
description: "Keyboard and mouse shortcuts for the scene player. R rates, M adds a marker, double-click jumps through the scene queue. Each feature can be turned off."
version: 1.0.0
url: https://github.com/allisless0/stash-plugins

ui:
  javascript:
    - QuickTools.js

settings:
  disableRating:
    displayName: Disable rating panel (R)
    description: "Turn off the R hotkey that opens the 0.0-10.0 rating panel."
    type: BOOLEAN
  disableMarkers:
    displayName: Disable marker panel (M)
    description: "Turn off the M hotkey that adds a scene marker at the current position."
    type: BOOLEAN
  enableNav:
    displayName: Enable double-click queue navigation
    description: "Off by default because it replaces double-click-to-fullscreen. When on, double-clicking the right half of the video plays the next scene in the queue and the left half the previous one. Hold Shift to get fullscreen back."
    type: BOOLEAN
