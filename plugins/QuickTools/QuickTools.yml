name: QuickTools
description: "Keyboard and mouse shortcuts for the scene player and performer pages. R rates, M adds a marker (Shift+M a range, U undoes), D marks the scene for delete, T adds and removes tags on scenes and performers, double-click or middle-click jumps through the scene queue. Each feature can be turned off."
version: 1.5.0
url: https://github.com/allisless0/stash-plugins

ui:
  javascript:
    - QuickTools.js

settings:
  disableRating:
    displayName: Disable rating panel (R)
    description: "Turn off the R hotkey that opens the 0.0-10.0 rating panel."
    type: BOOLEAN
  disableMarkers:
    displayName: Disable marker panel (M)
    description: "Turn off the M hotkey that adds a scene marker at the current position."
    type: BOOLEAN
  disableDelete:
    displayName: Disable mark for delete (D)
    description: "Turn off the D hotkey that toggles the delete tag on the current scene."
    type: BOOLEAN
  disableTags:
    displayName: Disable quick tags (T)
    description: "Turn off the T hotkey that opens the tag panel on scene and performer pages."
    type: BOOLEAN
  deleteTagName:
    displayName: Delete tag name
    description: "Tag that D toggles. Created the first time you press D. Leave blank for 'Marked for Delete'. Nothing is ever deleted by the plugin: filter the scene list by this tag when you want to clear them out."
    type: STRING
  enableNav:
    displayName: Enable double-click and middle-click queue navigation
    description: "Off by default because it replaces double-click-to-fullscreen. When on, double-clicking or middle-clicking the right half of the video plays the next scene in the queue and the left half the previous one. With the rating or marker panel open, the same click saves it and moves on. Hold Shift while double-clicking to get fullscreen back."
    type: BOOLEAN
